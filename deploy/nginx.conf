# SmartDesk AI - Nginx reverse proxy for SSE
# Replace server_name and add TLS (e.g. certbot) before production use.

upstream smartdesk_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name smartdesk.example.com;

    # 5 MB upload limit plus multipart overhead.
    client_max_body_size 6m;

    location / {
        proxy_pass http://smartdesk_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE: never buffer, allow long-lived streams.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header X-Accel-Buffering no;

        # Basic hardening headers.
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy strict-origin-when-cross-origin;
    }

    # Health probe without access logging noise.
    location = /api/health {
        access_log off;
        proxy_pass http://smartdesk_backend;
        proxy_set_header Host $host;
    }
}
